# House JSON Schema (draft 2020-12). Unconstrained patterns keep identifiers,
# dates and serialized scalar data exact-match without changing accepted values.
hr_team:
  properties:
    id:
      type: string
      pattern: ^[\s\S]*$
    name:
      type: string
  required:
  - id
  - name
hr_employee:
  properties:
    id:
      type: string
      pattern: ^[\s\S]*$
    createdAt:
      type: string
      pattern: ^[\s\S]*$
    updatedAt:
      type: string
      pattern: ^[\s\S]*$
    firstName:
      type: string
    lastName:
      type: string
    jobTitle:
      type: string
    email:
      type: string
      pattern: ^[\s\S]*$
    availableAnnualLeaveDays:
      type: number
    teamId:
      type: string
      pattern: ^[\s\S]*$
  required:
  - id
  - createdAt
  - updatedAt
  - firstName
  - lastName
  - jobTitle
  - email
  - availableAnnualLeaveDays
  - teamId
hr_time_off:
  properties:
    id:
      type: string
      pattern: ^[\s\S]*$
    createdAt:
      type: string
      pattern: ^[\s\S]*$
    updatedAt:
      type: string
      pattern: ^[\s\S]*$
    employeeId:
      type: string
      pattern: ^[\s\S]*$
    timeOffType:
      enum:
      - Annual
      - Sick
      - Casual
    startsAt:
      type: string
      pattern: ^[\s\S]*$
    endsAt:
      type: string
      pattern: ^[\s\S]*$
    notes:
      type: string
    status:
      enum:
      - Pending
      - Approved
      - Rejected
  required:
  - id
  - createdAt
  - updatedAt
  - employeeId
  - timeOffType
  - startsAt
  - endsAt
  - status
